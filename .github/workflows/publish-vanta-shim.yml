name: publish-vanta-deprecation

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Copy LICENSE into shim
        run: cp LICENSE legacy-vanta-shim/LICENSE

      - name: Publish @ziuus/vanta migration shim to npm
        working-directory: legacy-vanta-shim
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public --provenance || npm publish --access public
          npm deprecate @ziuus/vanta "Vanta has been renamed to Orbit. Please migrate to @ziuus/orbit: npm i -g @ziuus/orbit" || true
