[package]
default-run = "vanta"
name = "vanta"
version = "0.10.70"
edition = "2021"
description = "Aesthetic Rust TUI system dashboard — monitoring meets flex widgets"
authors = ["zius"]
license = "MIT"
repository = "https://github.com/ziuus/vanta"
readme = "README.md"
keywords = ["tui", "dashboard", "monitor", "ratatui", "system"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ureq = { version = "3.4.1", features = ["json"] }
serde_json = "1.0.151"
chrono-tz = "0.10.4"
ical = "0.11.0"
rss = "2.1.2"
extism = "1.30.0"
directories = "6.0.0"
clap = { version = "4.6.7", features = ["derive"] }
sha2 = "0.11.0"
log = "0.4.34"
trash = "5.2.9"
walkdir = "2.5.0"
base64 = "0.23.1"
ratatui-image = { version = "9.0.0", default-features = false, features = ["crossterm", "image-defaults"] }
open = "5.4.4"
arboard = "3.6.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
ratatui = "0.29"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
nowplaying = "0.1.1"
tokio = { version = "1.0", features = ["rt", "macros", "sync"] }
